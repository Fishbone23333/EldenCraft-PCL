name: PCL checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Minecraft bridge and run conformance checks
        working-directory: minecraft
        run: ./gradlew.bat build
      - name: Test PCL installer integrity
        working-directory: trials/pcl-adapter
        run: python -m unittest test_install_pcl test_optimized_bridge test_pcl_paths
      - name: Test F8 helper
        shell: powershell
        run: ./trials/pcl-adapter/test-character-switch.ps1
      - name: Test world profile selection and save isolation
        shell: powershell
        run: ./trials/pcl-adapter/test-world-profiles.ps1
      - name: Test and build native core
        shell: powershell
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 test --manifest-path native/Cargo.toml --lib -- --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo +1.99.0 build --manifest-path native/Cargo.toml --release -p eldencraft-native --lib
